[project]
name = "gift-aggregator-bot"
version = "0.1.0"
description = "Telegram gifts marketplace aggregator with deal alerts"
requires-python = ">=3.12"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "S", "BLE", "ARG"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict = false
